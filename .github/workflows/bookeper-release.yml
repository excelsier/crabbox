name: Channel Release (linux)

# Builds and publishes the linux controller archives of a channel tag from this
# branch. Dispatched by hand on the channel branch only; holds no secrets (the
# release job uses the run's own token) and signs nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Channel tag, vX.Y.Z-bookeper.N"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: channel-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build-linux-archives
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Guard tag and ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bookeper\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == "refs/heads/bookeper/channel" ]]

      - name: Check out the channel commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and verify the archives
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          scripts/bookeper-package-linux.sh "$RELEASE_TAG" "$RUNNER_TEMP/channel-out" | tee "$RUNNER_TEMP/channel-out.txt"
          cp "$RUNNER_TEMP/channel-out.txt" "$RUNNER_TEMP/channel-out/build-record.txt"

      - name: Upload the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channel-archives
          path: ${{ runner.temp }}/channel-out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: channel-archives
          path: out

      - name: Verify the checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd out && sha256sum -c checksums.txt)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; channel tags are never replaced" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" --notes "Channel build of $TARGET_SHA (linux only, unsigned). See build-record.txt for digests." \
            out/crabbox_*_linux_amd64.tar.gz out/crabbox_*_linux_arm64.tar.gz out/checksums.txt out/build-record.txt
